# Monolith CI — plan + preview deploy on PR, production deploy on main.
# Copy to .github/workflows/monolith.yml in your Worker repo.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN — Workers Scripts edit + read
# Optional secrets:
#   MONOLITH_STAGE — production stage name (default: production)

name: Monolith

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  monolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monolith CLI
        run: pnpm build

      - name: Plan preview (pull request)
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm monolith import wrangler.jsonc --preview || true
          pnpm monolith plan --preview

      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        id: preview_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          pnpm monolith deploy --preview --auto-approve | tee deploy.log
          WORKER_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1 || true)
          echo "worker_url=${WORKER_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview_deploy.outputs.worker_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<EOF
          ## Monolith preview deploy

          Preview Worker URL: ${{ steps.preview_deploy.outputs.worker_url }}

          Stage: \`pr-${{ github.event.pull_request.number }}\`
          EOF
          )"

      - name: Deploy production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONOLITH_STAGE: ${{ secrets.MONOLITH_STAGE }}
        run: |
          STAGE="${MONOLITH_STAGE:-production}"
          pnpm monolith deploy --stage "$STAGE" --auto-approve
