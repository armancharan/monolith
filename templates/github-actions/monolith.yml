# Monolith CI — plan on pull requests, deploy production on main.
# Copy to .github/workflows/monolith.yml in your Worker repo.
#
# Required secret: CLOUDFLARE_API_TOKEN (Workers Scripts edit + read)
# Optional secret: MONOLITH_STAGE (production stage name; default: production)

name: Monolith

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  monolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monolith CLI
        run: pnpm build

      - name: Plan preview (pull request)
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm monolith import wrangler.jsonc --preview || true
          pnpm monolith plan --preview

      - name: Deploy production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONOLITH_STAGE: ${{ secrets.MONOLITH_STAGE }}
        run: |
          STAGE="${MONOLITH_STAGE:-production}"
          pnpm monolith deploy --stage "$STAGE" --auto-approve
